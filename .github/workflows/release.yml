name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_MENHERA_COOLDOWN_INDEX: sparse+https://index.crates.menhera.org/10d/

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install openssl@3 pkg-config

      - name: Set OpenSSL environment (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install openssl

      - name: Set OpenSSL environment (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "OPENSSL_DIR=C:\Program Files\OpenSSL-Win64" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=C:\Program Files\OpenSSL-Win64\lib\pkgconfig" >> "$GITHUB_ENV"

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/selfhypnosis-audio

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: tar czf "selfhypnosis-audio-${{ matrix.target }}.tar.gz" -C target/${{ matrix.target }}/release selfhypnosis-audio

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/selfhypnosis-audio.exe" -DestinationPath "selfhypnosis-audio-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: selfhypnosis-audio-${{ matrix.target }}
          path: selfhypnosis-audio-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: selfhypnosis-audio-*

      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find dist -type f -name "selfhypnosis-audio-*" -exec cp {} upload/ \;

      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
